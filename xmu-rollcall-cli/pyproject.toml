[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmu-rollcall-dashboard"
dynamic = ["version"]
description = "Desktop and FastAPI dashboard for XMU TronClass rollcall monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "requests>=2.31.0",
    "pycryptodome>=3.19.0",
    "xmulogin>=1.0.0",
    "PySide6>=6.7.0",
]

[project.scripts]
xmu-dashboard = "xmu_rollcall.desktop_qt.app:main"
xmu-web = "xmu_rollcall.web.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xmu_rollcall*"]

[tool.setuptools.package-data]
"xmu_rollcall.web" = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "xmu_rollcall.__version__"}
